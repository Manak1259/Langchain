############################################################################
#Automatically generated config file
#
#Do not edit!!!! 
############################################################################

@version: 3.2
options {
    time_reopen (30);
    log_fifo_size (4096);
    use_dns (no);
    use_fqdn (yes);
    create_dirs (no);
    keep_hostname (yes);
    keep_timestamp (no);
    flush_lines(50);
    flush_timeout(0);
    stats-freq (1800);
    perm (0644);
};

filter f_debug    { level(debug..emerg); }; 
filter f_info     { level(info..emerg); }; 
filter f_notice   { level(notice..emerg); }; 
filter f_warning  { level(warning..emerg); }; 
filter f_err      { level(err..emerg); }; 
filter f_crit     { level(crit..emerg); }; 
filter f_alert    { level(alert..emerg); }; 
filter f_emerg    { level(emerg); }; 
filter f_safenet  { not ((program(vtl) or program(httpd) or program(named)) and level(info) and message('SSL Error is \(5 : 32 \)')); };

filter f_support  { (not program(dhcpd) and not program(named)) or level(notice..emerg); }; 

source s_internal {
    file ("/proc/kmsg" program_override("kernel: "));
    unix-stream ("/dev/log" max-connections(200));
};

source s_syslogng {
    internal();
};

template t_filetmpl { template("$ISODATE $FACILITY $HOST $PROGRAM[$PID]: $LEVEL $MSGONLY\n"); template_escape(no); };  

destination d_mesg { file("/var/log/messages" template(t_filetmpl));};

log { source(s_syslogng); source (s_internal);
      filter(f_safenet);
      destination(d_mesg); };

template t_support_filetmpl { template("$ISODATE $FACILITY $HOST $PROGRAM[$PID]: $LEVEL $MSGONLY\n"); template_escape(no); };  

destination d_support_mesg { file("/var/log/support_syslog" template(t_support_filetmpl));};

log { source(s_syslogng); source (s_internal);
      filter(f_support);
      destination(d_support_mesg); };

